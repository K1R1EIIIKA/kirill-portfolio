name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          mkdir -p _site/assets
          python3 - <<'PY'
          import json, urllib.request
          try:
              req=urllib.request.Request('https://itunes.apple.com/lookup?id=6499528122&country=us',headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  data=json.load(r)
              app=data['results'][0]
              screenshots=app.get('screenshotUrls') or app.get('ipadScreenshotUrls') or []
              if screenshots:
                  url=screenshots[0].replace('392x696bb','800x800bb')
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as r:
                      content=r.read()
                  with open('_site/assets/tap-gallery.jpg','wb') as f:
                      f.write(content)
                  print('Tap Gallery official artwork downloaded:',len(content),'bytes')
              else:
                  print('No official screenshots returned; emoji fallback will be used')
          except Exception as e:
              print('Artwork unavailable; keeping emoji fallback:',e)
          PY
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 10000
